<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Reaction Time Tester</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⚡ Interactive Reaction Time Tester</h1>

        <p class="subtitle">Test how fast you can react!</p>

        <div id="gameBox">

            <div class="icon">⏱️</div>

            <h2 id="message">Click the button below to start the test.</h2>

            <button id="startBtn">START</button>

        </div>

        <div class="stats">

            <div class="statBox">
                <h3>Best Time</h3>
                <p id="best">--</p>
            </div>

            <div class="statBox">
                <h3>Average Time</h3>
                <p id="average">--</p>
            </div>

            <div class="statBox">
                <h3>Total Attempts</h3>
                <p id="attempts">0</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
